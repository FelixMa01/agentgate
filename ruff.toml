target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line-too-long (we use ruff-format for wrapping)
    "B008",   # function-call-in-default-argument (Click uses this idiom)
    "B904",   # raise-from (we use bare raise for clarity in CLI handlers)
    "N802",   # function-name-should-be-lowercase (env var AGENTGATE_* uses uppercase)
]
fixable = ["ALL"]
unfixable = ["F401"]

[lint.per-file-ignores]
"tests/*" = ["E402", "F401"]
"src/agentgate/cli/*" = ["E402", "F401"]
"src/agentgate/__init__.py" = ["F401"]
"src/agentgate/*_hook.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"