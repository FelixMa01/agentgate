version: 1
metadata:
  author: agentgate
  version: 1
  last_reviewed: 2026-08-14

default: allow

rules:
  - id: deny-rm-rf
    name: Block destructive rm
    match:
      tool: Bash
      command_glob: "rm -rf /*"
    action: deny
    reason: "Mass deletion outside repo"

  - id: deny-secrets-read
    name: Block reading secrets
    match:
      tool: Read
      file_glob: ["*.pem", ".env*", "*id_rsa*"]
    action: deny
    reason: "Secret files are off-limits"

  - id: ask-network-exfil
    name: Require approval for new domains
    match:
      tool: Bash
      command_glob: ["curl *", "wget *", "http*"]
    action: ask
    reason: "Outbound network from agent"

  - id: log-grep
    name: Log read-only search
    match:
      tool: Grep
    action: log
    reason: ""

network:
  allowed_domains:
    - github.com
    - "*.githubusercontent.com"
    - pypi.org
    - "*.pypi.org"
    - openai.com
    - "*.openai.com"
    - anthropic.com
    - "*.anthropic.com"
  denied_domains:
    - pastebin.com
    - transfer.sh
    - "*gist.github.com/leak*"
  require_https: true
