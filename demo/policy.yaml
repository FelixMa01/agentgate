version: 1
default_action: ask
rules:
- id: allow-reads
  match:
    tool:
    - Read
    - Glob
    - Grep
  action: allow
  reason: Read-only inspection
- id: allow-git-status
  match:
    tool: Bash
    command_glob: git status*
  action: allow
  reason: Safe git read
- id: allow-git-diff
  match:
    tool: Bash
    command_glob: git diff*
  action: allow
  reason: Safe git read
- id: deny-network
  match:
    tool:
    - WebFetch
    - Curl
  action: deny
  reason: Network blocked
- id: deny-rm
  match:
    tool: Bash
    command_regex: rm\s+(-.*\s+)?(/\s*$|~\s*$|\.\s*$|\*\s*$)
  action: deny
  reason: Destructive rm blocked
- id: ask-bash
  match:
    tool: Bash
  action: ask
  reason: Shell command needs approval
- id: ask-write
  match:
    tool:
    - Write
    - Edit
  action: ask
  reason: File modification needs approval
