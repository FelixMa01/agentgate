name: publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # for PyPI trusted publishing (OIDC) — only needed if PYPI_TOKEN is unset
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run tests
        run: uv run pytest tests/ -v
      - name: End-to-end verify
        run: bash scripts/verify.sh
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        if: env.PYPI_TOKEN != ''
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish dist/*
      - name: Publish to PyPI via trusted publishing
        if: env.PYPI_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted publishing (OIDC) — requires a PyPI "pending publisher" configured
        # at https://pypi.org/manage/account/publishing/ for owner=FelixMa01,
        # repo=agentgate, workflow=publish.yml.

  github-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog
        id: changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${VERSION#v}
          CHANGELOG=$(awk -v VERSION="$VERSION" '/^## \[/ && $2 == "["VERSION"]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md || true)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.changelog }}
