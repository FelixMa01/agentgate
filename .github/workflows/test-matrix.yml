# Cross-platform test matrix: ubuntu + macOS + Windows.
# Runs the same unit tests + e2e verify across all 3 OSes on Python 3.13.

name: test-matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11"
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: uv sync --all-extras
      - name: Run unit tests
        shell: bash
        run: uv run pytest tests/ -v --ignore=tests/test_dns_sinkhole.py
        # test_dns_sinkhole needs real /etc/resolver, skip on Windows + macOS CI

  e2e:
    name: e2e verify
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: End-to-end verify
        run: bash scripts/verify.sh