[project]
name = "agentgate"
version = "0.1.0"
description = "Firewall for AI coding agents — intercept, log, approve every action."
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "click>=8.4.2",
    "pytest>=9.1.1",
]

[project.scripts]
agentgate = "agentgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]