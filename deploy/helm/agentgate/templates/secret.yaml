apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentgate.fullname" . }}-auth
  labels:
    {{- include "agentgate.labels" . | nindent 4 }}
type: Opaque
data:
  # AGENTGATE_TOKEN - used by agent hosts to push events.
  # Override with: --set auth.token=$(openssl rand -hex 32)
  token: {{ .Values.auth.token | b64enc | quote }}
